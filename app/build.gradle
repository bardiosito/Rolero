plugins { id 'com.android.application' }
android {
    namespace = 'mx.rolero.app'
    compileSdk = 35
    defaultConfig {
        applicationId = 'mx.rolero.app'
        minSdk = 26
        targetSdk = 35
        versionCode = 7
        versionName = '1.6.0'
    }
    signingConfigs {
        debug {
            def localSigningKey = rootProject.file('build/rolero-dev.jks')
            if (localSigningKey.exists()) {
                storeFile = localSigningKey
                storePassword = 'rolero-local'
                keyAlias = 'rolero'
                keyPassword = 'rolero-local'
            }
        }
    }
    buildTypes {
        debug { debuggable = true; signingConfig = signingConfigs.debug }
        release { minifyEnabled = false; signingConfig = signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig = true }
}
